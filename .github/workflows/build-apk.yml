name: Build Flix APK

# This builds a real APK in the cloud, for free, without installing
# Flutter or Android Studio on your own computer.
# Put these files in a GitHub repo, in this layout:
#   lib/main.dart
#   pubspec.yaml
#   README.md
#   .github/workflows/build-apk.yml   <- this file
# PHONE-ONLY NOTE: If you upload on your phone and GitHub puts
# main.dart in the repo root (not in lib/), this workflow still
# works - it moves main.dart into lib/ automatically.
# Then push to GitHub, open the Actions tab, and download the
# "flix-apk" artifact. Unzip it to get app-release.apk.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.x"

      - name: Create a fresh Flutter project and copy Flix code into it
        run: |
          if [ ! -f lib/main.dart ] && [ -f main.dart ]; then mkdir -p lib; mv main.dart lib/main.dart; fi
          flutter create --project-name flix --org com.dino.flix --platforms android temp_flix
          cp lib/main.dart temp_flix/lib/main.dart
          cp pubspec.yaml temp_flix/pubspec.yaml
          # App icon: use assets/icon.png if uploaded, or icon.png in the repo root
          if [ -f assets/icon.png ]; then mkdir -p temp_flix/assets; cp assets/icon.png temp_flix/assets/icon.png;
          elif [ -f icon.png ]; then mkdir -p temp_flix/assets; cp icon.png temp_flix/assets/icon.png; fi

      - name: Build APK
        run: |
          cd temp_flix
          # Firebase needs minSdk 23; fresh Flutter projects may use 21
          sed -i 's/minSdk = 21/minSdk = 23/; s/minSdkVersion 21/minSdkVersion 23/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          # Inject this build's tag so the app can tell old from new.
          # The app compares this tag with the latest GitHub release tag.
          sed -i "s/const String kBuildTag = 'dev';/const String kBuildTag = 'build-${{ github.run_number }}';/" lib/main.dart || true
          flutter pub get
          # Generate the launcher icon from assets/icon.png (keeps building even if this fails)
          dart run flutter_launcher_icons || echo "Icon generation skipped, continuing with default icon"
          # FIX THE ICON PROPERLY: the launcher tool shrinks the logo into
          # the safe zone and puts it on a white tile, which is why the
          # home screen showed a small black logo in a white square.
          # Overwrite every launcher icon with the full cropped logo,
          # edge to edge, so the red edge of the box is at the tile edge,
          # and make the adaptive background black, not white.
          pip install pillow -q || true
          python3 - << 'PY'
          import os, re
          from PIL import Image
          icon = 'assets/icon.png'
          if os.path.exists(icon):
              im = Image.open(icon).convert('RGBA')
              base = 'android/app/src/main/res'
              legacy = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
              foreground = {'mipmap-mdpi': 108, 'mipmap-hdpi': 162, 'mipmap-xhdpi': 216, 'mipmap-xxhdpi': 324, 'mipmap-xxxhdpi': 432}
              for folder, size in legacy.items():
                  p = os.path.join(base, folder, 'ic_launcher.png')
                  if os.path.isdir(os.path.join(base, folder)):
                      im.resize((size, size), Image.LANCZOS).save(p)
              for folder, size in foreground.items():
                  p = os.path.join(base, folder, 'ic_launcher_foreground.png')
                  if os.path.isdir(os.path.join(base, folder)):
                      im.resize((size, size), Image.LANCZOS).save(p)
              # Adaptive background: the launcher tool puts the background
              # file in different places in different Flutter versions
              # (values/ or drawable/), and it defaults to WHITE if not
              # set. That white background is why build #20 still showed
              # a small logo on a white tile. Force EVERY background
              # file to black, wherever it lives.
              for root, dirs, files in os.walk(base):
                  for fn in files:
                      if fn == 'ic_launcher_background.xml':
                          p = os.path.join(root, fn)
                          t = open(p).read()
                          t2 = re.sub(r'#[0-9A-Fa-f]{6,8}', '#000000', t)
                          t2 = re.sub(r'android:fillColor="[^"]+"', 'android:fillColor="#000000"', t2)
                          open(p, 'w').write(t2)
                          print('Background forced to black:', p)
              print('Launcher icons overwritten edge to edge')
          else:
              print('No icon.png found, keeping default icon')
          PY
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flix-apk
          path: temp_flix/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This creates the direct APK download link used by the app's
          # update check and by the Share message, for example:
          # https://github.com/AbdulMannan2613/Flix/releases/download/build-12/app-release.apk
          # The file name is always app-release.apk - the release tag is
          # what tells old from new, not the file name.
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" temp_flix/build/app/outputs/flutter-apk/app-release.apk --title "Flix $TAG" --notes "Latest Flix APK. Download app-release.apk and install it." || echo "Release creation skipped"
          
