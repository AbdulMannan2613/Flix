name: flix
description: "Flix - Stream Unlimited Movies & TV Shows"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  video_player: ^2.9.5
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  dio: ^5.4.0
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# NOTE: icon.png is NOT listed under assets above on purpose.
# flutter_launcher_icons reads it directly from the file, but if it were
# listed as a Flutter asset and the file was missing from the build folder,
# 'flutter build apk' would fail. The workflow copies icon.png into
# temp_flix/assets/ for the launcher tool only.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  
